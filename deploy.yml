apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: zomato
  name: zomato-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zomato
  template:
    metadata:
      labels:
        app: zomato
    spec:
      containers:
      - name: cont1
        image: rahamshaik/nodejsimage:d4f28fff814f79e62fc3fcb557716df9855154ec
        ports:
          - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: service1
spec:
  type: NodePort
  selector:
    app: zomato
  ports:
    - port: 80
      nodePort: 31111

